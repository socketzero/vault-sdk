name: Publish to npm

# Fires when release-please's PR is merged and it publishes a GitHub release.
# Nothing here interpolates untrusted event text into a run: command.
on:
  release:
    types: [published]
  workflow_dispatch:

# No long-lived npm token: publishing authenticates with a short-lived OIDC
# token minted per run, which is what `id-token: write` grants.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment` is optional for trusted publishing, but if you name one here
    # it MUST match the environment configured on the npm trusted publisher.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships an npm older than the 11.5.1 that understands OIDC
      # trusted publishing, so pin a new enough CLI explicitly.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # Deliberately inert until publishing is opted into: the package is marked
      # private, and npm cannot mint a trusted publisher for a name that does not
      # exist yet. Skipping loudly beats failing every release, and beats
      # publishing something nobody decided to publish. See RELEASING.md.
      - name: Check publish prerequisites
        id: gate
        run: |
          if node -e "process.exit(require('./package.json').private === true ? 1 : 0)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::package.json still has \"private\": true — skipping publish. See RELEASING.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.gate.outputs.ok == 'true'
        run: npm ci

      - name: Verify before publishing
        if: steps.gate.outputs.ok == 'true'
        run: npm run check

      # No NODE_AUTH_TOKEN. OIDC supplies the credential, and npm attaches
      # provenance automatically for a trusted-publisher release.
      - name: Publish
        if: steps.gate.outputs.ok == 'true'
        run: npm publish
