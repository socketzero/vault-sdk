name: Publish to npm

# Fires when release-please's PR is merged and it publishes a GitHub release.
# Nothing here interpolates untrusted event text into a run: command.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Deliberately inert until publishing is actually opted into: the package
      # is marked private and needs a token. Skipping loudly beats failing every
      # release, and beats publishing something nobody decided to publish.
      - name: Check publish prerequisites
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set — skipping publish."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif node -e "process.exit(require('./package.json').private === true ? 1 : 0)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::package.json still has \"private\": true — skipping publish. See RELEASING.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.gate.outputs.ok == 'true'
        run: npm ci

      - name: Verify before publishing
        if: steps.gate.outputs.ok == 'true'
        run: npm run check

      - name: Publish
        if: steps.gate.outputs.ok == 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
