name: Release Please

# Runs on pushes to main only; nothing here consumes untrusted event text.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Maintain the release PR and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs['.--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing lives here rather than in its own `on: release` workflow because
  # release-please cuts the release with GITHUB_TOKEN, and GitHub deliberately
  # does not let events from that token start another workflow run. An
  # `on: release: [published]` workflow would therefore never fire — it would sit
  # green and idle forever. Chaining off this job's output is what actually runs.
  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC: the only credential publishing uses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships an npm older than the 11.5.1 that understands OIDC
      # trusted publishing, so pin a new enough CLI explicitly.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # Two conditions, both self-clearing, so this never fails a release for a
      # reason nobody has acted on yet:
      #
      #   1. the package is still marked private, or
      #   2. the name does not exist on the registry yet — npm cannot bind a
      #      trusted publisher to a package that has never been published, so
      #      the first version must go up by hand (see RELEASING.md). Publishing
      #      from CI before that binding exists would fail with no credential.
      #
      # Once the bootstrap publish has happened, this gate opens on its own.
      - name: Check publish prerequisites
        id: gate
        run: |
          if ! node -e "process.exit(require('./package.json').private === true ? 1 : 0)"; then
            echo "::notice::package.json has \"private\": true — skipping publish. See RELEASING.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name=$(node -e "process.stdout.write(require('./package.json').name)")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}")
          if [ "$code" = "404" ]; then
            echo "::notice::${name} is not on the registry yet. npm cannot bind a trusted publisher to a name that has never been published, so publish the first version by hand — see RELEASING.md. Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.gate.outputs.ok == 'true'
        run: npm ci

      - name: Verify before publishing
        if: steps.gate.outputs.ok == 'true'
        run: npm run check

      # No NODE_AUTH_TOKEN: OIDC supplies the credential.
      #
      # Deliberately no --provenance. GitHub withdrew provenance for private
      # source repositories in July 2023, and it is the *repository* visibility
      # that decides, not the package's — a public package built from a private
      # repo is exactly the unsupported case, and the publish fails with
      # "Unsupported GitHub Actions source repository visibility". Trusted
      # publishing does not change this: 0.3.0 and 0.3.1 both published with
      # signatures and no attestation.
      #
      # Making socketzero/vault-sdk public is the only thing that unlocks it.
      # Add --provenance in the same change, never before.
      - name: Publish
        if: steps.gate.outputs.ok == 'true'
        run: npm publish
